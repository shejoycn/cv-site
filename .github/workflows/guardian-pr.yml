name: AI Deployment Guardian (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  guardian:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # IMPORTANT: checkout the PR branch so we can commit back to it
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install tools
        working-directory: tools/ai-guardian
        run: npm ci

      - name: Install Playwright browsers (Chromium)
        working-directory: tools/ai-guardian
        run: npx playwright install --with-deps chromium

      - name: PR AI Review (diff-based)
        working-directory: tools/ai-guardian
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node pr-review.js

      - name: Wait for Netlify Deploy Preview + Visual AI Check
        working-directory: tools/ai-guardian
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.head_ref }}
        run: node visual-check.js

      # NEW: Commit screenshots to the PR branch so they can be embedded via raw.githubusercontent.com
      - name: Commit screenshots to PR branch (for inline PR images)
        if: always()
        run: |
          set -e

          PR_NUM="${{ github.event.pull_request.number }}"
          OUT_DIR="pr-artifacts/screenshots/pr-${PR_NUM}"

          mkdir -p "${OUT_DIR}"
          cp tools/ai-guardian/artifacts/screenshots/*.png "${OUT_DIR}/" || true

          # If nothing copied, don't commit
          if ls "${OUT_DIR}"/*.png 1> /dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add "${OUT_DIR}"
            git commit -m "chore(ai-guardian): add screenshots for PR #${PR_NUM}" || true
            git push origin "HEAD:${{ github.head_ref }}"
          else
            echo "No screenshots found to commit."
          fi

      - name: If Netlify build failed → AI diagnosis comment
        if: failure()
        working-directory: tools/ai-guardian
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node build-diagnose.js